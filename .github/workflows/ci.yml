name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches backend/Dockerfile so CI tests what we actually ship.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: pytest

  migrations:
    name: Backend · migrations resolve to one head
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install alembic
        run: pip install "alembic>=1.13.0"

      - name: Assert a single migration head
        working-directory: backend
        # The container runs `alembic upgrade head` on boot (see Dockerfile).
        # Two heads — easy to create when branches add migrations in parallel —
        # make that command fail and take the whole deploy down. Catch it here
        # instead of at 3am. Reads migration scripts only; needs no database.
        run: |
          heads=$(alembic heads 2>/dev/null | grep -c '(head)' || true)
          echo "Alembic heads found: $heads"
          alembic heads
          if [ "$heads" -ne 1 ]; then
            echo "::error::Expected exactly 1 alembic head, found $heads. Merge them with 'alembic merge'."
            exit 1
          fi

  frontend:
    name: Frontend · typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This repo uses pnpm (pnpm-lock.yaml), not npm.
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend
        run: pnpm exec tsc --noEmit

      - name: Build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm run build
